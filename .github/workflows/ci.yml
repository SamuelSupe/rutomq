name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  rust:
    name: Rust 1.88
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: rutomq
          POSTGRES_PASSWORD: rutomq
          POSTGRES_DB: rutomq_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rutomq -d rutomq_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      RUTOMQ_TEST_PG_URL: postgres://rutomq:rutomq@127.0.0.1:5432/rutomq_ci
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.88.0 --profile minimal --component rustfmt,clippy

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-1.88-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-1.88-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run strict Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Run workspace tests
        run: cargo test --workspace --all-features --locked

      - name: Build release workspace
        run: cargo build --release --workspace --locked

  helm:
    name: Helm chart
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Show Helm version
        run: helm version

      - name: Lint chart
        run: helm lint deploy/helm/rutomq

      - name: Render chart
        run: helm template rutomq deploy/helm/rutomq > /tmp/rutomq-chart.yaml
